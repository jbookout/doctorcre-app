<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="DoctorCRE Home">
  <title>Home · DoctorCRE</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/dealroom-192.png">
  <link rel="icon" href="/icons/dealroom.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="/js/theme-boot.js"></script>
  <link rel="modulepreload" href="/js/home-dashboard-model.js">
  <link rel="modulepreload" href="/js/boot-mode.js">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="preload" as="style" data-font-stylesheet href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/workspace.css">
  <link rel="stylesheet" href="/css/home-dashboard.css">
  <link rel="stylesheet" href="/css/call-outcomes.css">
  <link rel="stylesheet" href="/css/lease-radar.css">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/relationship-network.css">
</head>
<body>
  <script type="module" async src="/js/home-boot.js"></script>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <a class="skip" href="#main">Skip to Home</a>


  <main id="main" class="shell home-shell">
    <section data-layout-slot="sidebar" class="hero home-hero">
      <div><h1 id="pageTitle">Home</h1></div>
      <div class="home-tools">
        <div data-layout-slot="tabs" class="scope-switch" id="scopeSwitch" role="group" aria-label="Home scope">
          <button type="button" class="scope-option on" data-scope="team" aria-pressed="true">Team view</button>
          <button type="button" class="scope-option" data-scope="mine" aria-pressed="false">Just me</button>
        </div>
        <div data-layout-slot="status" class="home-updated"><span id="observedAt" class="observed" role="status">Updating…</span><button data-layout-refresh id="refreshHome" class="home-refresh" type="button" aria-label="Refresh Home" title="Refresh"><span aria-hidden="true">↻</span></button></div>
      </div>
    </section>
    <p id="homeNotice" class="home-notice" role="status" hidden></p>
    <section id="homeMeetings" class="home-panel" aria-label="Upcoming meetings" hidden></section>
    <section id="homeCallOutcomes" class="home-panel call-outcomes" aria-label="Applied from the pipeline call" hidden></section>
    <section id="dealAttention" class="home-panel home-deals" aria-labelledby="dealAttentionTitle" aria-live="polite" aria-busy="true">
      <header class="home-panel-head"><div><h2 id="dealAttentionTitle">Deals</h2><p id="dealCounts" class="home-counts"><span>Active deals: <b>—</b></span> <span>In market: <b>—</b></span> <span>National accounts: <b>—</b></span></p></div><a id="homePrimaryAction" class="home-outline" href="/deals">Open deal room <span aria-hidden="true">↗</span></a></header>
      <div id="dealFlags" class="home-flags"><p class="home-empty">Updating…</p></div>
      <section id="homeCallTasks" class="home-call-tasks" aria-label="Call tasks to review" hidden></section>
    </section>
    <div class="home-grid">
      <section id="homeCalendar" class="home-panel" aria-label="Calendar" aria-busy="true"><header class="home-panel-head"><h2>Calendar &amp; tasks</h2></header><p class="home-empty" role="status">Updating calendar and tasks…</p></section>
    <section id="homeEmailFollowups" class="home-panel" aria-label="Email follow-ups" aria-busy="true"><header class="home-panel-head"><h2>Email follow-ups</h2></header><p class="home-empty">Loading email follow-ups…</p></section>
      <section id="homeInvoices" class="home-panel" aria-label="Invoice attention" hidden></section>
      <section id="homePastClients" class="home-panel" aria-label="Past clients" hidden></section>
      <section id="homeIntroductions" class="home-panel" aria-label="Suggested introductions" hidden></section>
      <section id="homeLeads" class="home-panel" aria-label="New leads" hidden></section>
    </div>
  </main>
  <dialog id="homeDetail" class="home-detail" aria-labelledby="homeDetailTitle"><article id="homeDetailBody"></article></dialog>
  <script type="module" src="/js/workspace-command-center.js"></script>
</body>
</html>
