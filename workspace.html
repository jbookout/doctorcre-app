<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="DoctorCRE Home — what needs your attention">
  <title>Home · DoctorCRE</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/dealroom-192.png">
  <link rel="icon" href="/icons/dealroom.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/workspace.css">
  <link rel="stylesheet" href="/css/home-dashboard.css">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/relationship-network.css">
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <a class="skip" href="#main">Skip to Home</a>


  <main id="main" class="shell home-shell">
    <section data-layout-slot="sidebar" class="hero home-hero">
      <div><p class="eyebrow">Your day, in focus</p><h1 id="pageTitle">Home</h1></div>
      <div class="home-tools">
        <div data-layout-slot="tabs" class="scope-switch" id="scopeSwitch" role="group" aria-label="Home scope">
          <button type="button" class="scope-option on" data-scope="team" aria-pressed="true">Team View</button>
          <button type="button" class="scope-option" data-scope="mine" aria-pressed="false">Just Me</button>
        </div>
        <div data-layout-slot="status" class="home-updated"><span id="observedAt" class="observed" role="status">Updating…</span><button data-layout-refresh id="refreshHome" class="home-refresh" type="button" aria-label="Refresh Home" title="Refresh"><span aria-hidden="true">↻</span></button></div>
      </div>
    </section>
    <p id="homeNotice" class="home-notice" role="status" hidden></p>
    <section id="dealAttention" class="home-panel home-deals glass" aria-label="Deal flags" aria-live="polite" aria-busy="true">
      <header class="home-panel-head"><h2 id="dealCounts">Active Deals: — <span>Deals in Market: —</span> <span>National Account Deals: —</span></h2><a id="homePrimaryAction" class="home-outline" href="/deals">Deal Room <span aria-hidden="true">↗</span></a></header>
      <div id="dealFlags" class="home-flags"><p class="home-empty">Updating…</p></div>
    </section>
    <section id="homeInvoices" class="home-panel glass" aria-label="Invoice attention" hidden></section>
    <div class="home-grid">
      <section id="homeCalendar" class="home-panel glass" aria-label="Calendar" hidden></section>
      <section id="homeControl" class="home-panel glass" aria-label="Control room" hidden></section>
      <section id="homeIntroductions" class="home-panel glass" aria-label="Suggested introductions" hidden></section>
      <section id="homeLeads" class="home-panel glass" aria-label="New leads" hidden></section>
    </div>
  </main>
  <dialog id="homeDetail" class="home-detail" aria-labelledby="homeDetailTitle"><article id="homeDetailBody"></article></dialog>
  <script type="module" src="/js/workspace-command-center.js"></script>
</body>
</html>
