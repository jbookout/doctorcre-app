<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Home Charts · DoctorCRE</title>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="preload" as="style" data-font-stylesheet href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/system.css">
  <link rel="stylesheet" href="/css/business-workspace.css">
  <link rel="stylesheet" href="/css/app-shell.css">
  <style>
    .historical-fit { margin-top: var(--space-4, 24px); min-width: 0; }
    .historical-fit form { display: flex; flex-wrap: wrap; gap: 12px; margin-block: 16px; }
    .historical-fit label { display: grid; gap: 4px; min-width: 0; flex: 1 1 180px; }
    .historical-fit :is(input, button) { min-height: var(--touch); padding: 8px 12px; border: 1px solid var(--hairline-strong); border-radius: var(--radius-2); background: var(--surface-2); color: var(--fg); font: inherit; }
    .historical-fit summary { min-height: var(--touch); cursor: pointer; }
    .historical-fit input { width: 100%; min-width: 0; box-sizing: border-box; }
    .historical-fit table { width: 100%; min-width: 580px; font-size: var(--font-size-1); }
    .historical-fit th, .historical-fit td { padding: 8px; text-align: left; vertical-align: top; }
    .historical-fit td:last-child { max-width: 320px; overflow-wrap: anywhere; }
    .historical-fit .chart-scroll { overflow-x: auto; max-width: 100%; }
    @media (max-width: 600px) {
      .historical-fit table { min-width: 0; }
      .historical-fit caption { display: block; text-align: left; }
      .historical-fit thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .historical-fit :is(table, tbody, tr) { display: block; }
      .historical-fit tr { padding-block: 12px; border-top: 1px solid var(--hairline); }
      .historical-fit td { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .historical-fit td::before { content: attr(data-label); font-weight: 600; }
      .historical-fit td:last-child { max-width: none; }
      .historical-fit td ul { padding-left: 16px; }
      .historical-fit form button { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <a class="skip" href="#main">Skip to charts</a>
  <main id="main" class="shell">
    <div data-layout-slot="sidebar" class="hero"><div><h1>Charts</h1>
      <nav data-layout-slot="tabs" class="page-views" aria-label="Home pages"><a href="/">Overview</a><a href="/?view=charts" aria-current="page">Charts</a></nav>
    </div></div>
    <section class="card glass" data-charts="read" aria-labelledby="chartsTitle">
      <div class="card-heading"><div><h2 id="chartsTitle">Board snapshot</h2></div><span class="caption" id="chartsReadAt">Reading the board…</span></div>
      <p class="caption" id="chartsOneRead"></p><p class="caption" id="chartsSnapshot"></p><p class="caption" id="chartsForecast"></p>
    </section>
    <p class="sr-only" id="chartsLive" aria-live="polite" role="status"></p>
    <div class="state-block" id="chartsState" data-state="loading" hidden></div>
    <div id="chartsCanvas" class="charts-canvas" aria-busy="false"></div>
    <div id="historicalClientFit"></div>
  </main>
  <script type="module" src="/js/charts-page.js"></script>
</body>
</html>
