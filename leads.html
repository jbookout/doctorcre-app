<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leads · DoctorCRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="/js/theme-boot.js"></script>
<link rel="stylesheet" href="/css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="preload" as="style" data-font-stylesheet>
<link rel="stylesheet" href="/css/app-shell.css"><link rel="stylesheet" href="/css/leads.css">
</head>
<body class="leads-body"><div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
<a class="skip" href="#leadBoard">Skip to lead board</a>
<main class="leads-workspace">
<header class="page-heading"><h1>Leads <span id="leadCount"></span></h1><div data-layout-slot="status" class="freshness"><time id="boardUpdated">Updating…</time><button data-layout-refresh id="refreshBoard" aria-label="Refresh leads" title="Refresh leads">↻</button></div></header>
<section class="controls glass" aria-label="Lead filters">
<label class="search"><span class="sr-only">Search leads</span><input id="leadSearch" type="search" placeholder="Search leads" autocomplete="off"></label>
<label>Owner<select id="ownerFilter"><option value="">All owners</option></select></label>
<label>Market<select id="marketFilter"><option value="">All markets</option></select></label>
<output id="filterSummary" aria-live="polite"></output>
</section>
<p id="leadBoardError" role="alert" hidden></p><label class="stage-nav">Stage<select id="stageFilter" aria-label="Board stage"></select></label><div id="leadBoard" aria-busy="true"><span class="sr-only" role="status">Loading leads…</span></div>
<section class="top-grid">
<div class="hot-section glass"><div class="section-heading"><h2 id="hotTitle">Hottest leads to claim</h2><time id="searchUpdated" title="Last new-lead search">New-lead search —</time></div><p id="hotSummary" class="hot-summary"></p><div id="hotLeads" aria-busy="true"></div></div>
<div class="territory glass"><div class="section-heading"><h2>Territory</h2><button id="clearMarket" hidden>All markets</button></div><button id="showTerritory" type="button" aria-controls="territoryMap" aria-expanded="false">Show territory</button><div id="territoryMap" aria-label="Lead count by market" role="region" hidden></div><details id="mapLeadMembers"><summary>Map leads</summary><div></div></details><div id="marketCounts" aria-label="Markets"></div><small class="map-credit">Market areas only · U.S. Census · 2025</small></div>
</section>
</main>
<dialog id="leadDetail" class="detail-dialog" aria-labelledby="detailTitle"><div class="dialog-heading"><h2 id="detailTitle"></h2><button id="closeDetail" aria-label="Close lead details">×</button></div><div id="detailBody"></div></dialog>
<dialog id="stageDialog" class="stage-dialog" aria-labelledby="stageTitle"><div class="dialog-heading"><h2 id="stageTitle">Doc</h2><button id="closeStage" aria-label="Cancel stage change">×</button></div><div id="stageContext"></div><form id="stageForm"><div id="stageQuestions"></div><p id="stageError" role="alert" hidden></p><button id="saveStage" type="submit">Confirm</button></form></dialog>
<div id="moveAnnouncement" class="sr-only" role="status" aria-live="polite"></div>
<script type="module" src="/js/leads-workspace-app.js"></script>
</body></html>
