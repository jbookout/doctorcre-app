<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="DoctorCRE records">
  <title>Records · DoctorCRE</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/dealroom-192.png">
  <link rel="icon" href="/icons/dealroom.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="preload" as="style" data-font-stylesheet href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/workspace.css">
  <link rel="stylesheet" href="/css/workspace-business.css">
  <link rel="stylesheet" href="/css/correspondence.css">
  <link rel="stylesheet" href="/css/app-shell.css">
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <!-- A client opens as a dialog and a vendor as a card beside the table. A
       dialog's covered background is inert so focus remains inside it. -->
  <a class="skip" href="#main" data-panel-background>Skip to records</a>


  <main id="main" class="shell business-shell">
    <div class="result-heading" data-layout-slot="tabs">
      <h1 class="result-title visually-hidden" id="resultsTitle">Records</h1>
      <a class="place-back" id="placeBack" href="/clients" hidden>Clients</a>
      <a class="place-back" id="accountsBack" href="/clients?accounts=true" hidden>National Accounts</a>
      <p class="result-summary" id="resultSummary" tabindex="-1">Checking…</p>
    </div>

    <div class="directory-views" id="directoryViews" data-layout-slot="tabs" role="group" aria-label="Vendor views">
      <button type="button" data-directory-view="list" aria-pressed="true">Categories</button>
      <button type="button" data-directory-view="meetings" aria-pressed="false">People worth meeting</button>
    </div>

    <div class="search-dock glass" data-panel-background>
      <div class="field field-search">
        <label class="visually-hidden" for="searchInput">Search</label>
        <input id="searchInput" name="q" form="filterForm" type="search" autocomplete="off" spellcheck="false" maxlength="80" placeholder="Search by name">
      </div>
      <details id="secondaryFilters" open>
        <summary>Filters and sort</summary>
      <form id="filterForm" class="filter-form" novalidate aria-label="Search and filter">
        <div class="filter-row filter-row-actions">
          <div class="scope-switch" id="scopeSwitch" role="group" aria-label="Record scope" data-layout-slot="tabs">
            <button type="button" class="scope-option on" data-owner="all" aria-pressed="true">All</button>
            <button type="button" class="scope-option" data-owner="joe" aria-pressed="false">Joe</button>
            <button type="button" class="scope-option" data-owner="dell" aria-pressed="false">Dell</button>
          </div>
          <div class="filter-actions">
            <button type="submit" class="action primary-action" id="applyFilters">Apply</button>
            <button type="button" class="action secondary-action" id="resetFilters">Reset</button>
          </div>
        </div>
      </form>
      </details>
      <div id="tableFilters" class="table-filters" role="group" aria-label="Show only" hidden></div>
      <div class="hero-meta" aria-label="Status">
        <span id="observedAt" class="observed visually-hidden">Updating…</span><button type="button" class="refresh-icon" id="refreshList" aria-label="Refresh" title="Refresh">↻</button>
      </div>
    </div>
    <div id="chipBar" class="chip-bar" role="group" aria-label="Active filters" data-panel-background></div>

    <div id="noticeRegion" class="notice-region" role="status" aria-live="polite" data-panel-background></div>

    <section class="business-body" aria-labelledby="resultsTitle">
      <div class="result-column" data-panel-background>
        <div id="directoryTiles" class="directory-tiles" aria-describedby="resultSummary" hidden></div>
        <div id="listRegion" class="list-region" aria-busy="true" aria-describedby="resultSummary">
          <ol class="record-list" id="recordList">
            <li class="record-skeleton"><span class="skeleton-line"></span><span class="skeleton-line short"></span></li>
            <li class="record-skeleton"><span class="skeleton-line"></span><span class="skeleton-line short"></span></li>
            <li class="record-skeleton"><span class="skeleton-line"></span><span class="skeleton-line short"></span></li>
          </ol>
        </div>
        <div id="scrollSentinel" aria-hidden="true"></div>

      </div>

      <div class="record-backdrop" id="recordBackdrop" hidden></div>
      <aside class="record-panel record-card glass" id="recordPanel" role="dialog" aria-modal="true" aria-labelledby="recordTitle" hidden>
        <div class="record-panel-head">
          <a class="panel-back" id="recordBack" href="/vendors">Vendors</a>
          <div class="record-panel-title">
            <h2 id="recordTitle" tabindex="-1">Opening…</h2>
            <p class="record-tone"><span id="recordMeta"></span></p>
          </div>
          <button type="button" class="panel-more" id="recordMore" popovertarget="recordActions" aria-controls="recordActions" aria-expanded="false" aria-label="Record actions">⋯</button>
          <div class="record-panel-actions" id="recordActions" popover></div>
          <button type="button" class="panel-close" id="recordClose" aria-label="Close record">×</button>
          <div class="record-relationship" id="recordRelationship" tabindex="-1" hidden></div>
          <p class="record-panel-status" id="recordStatus" role="status" aria-live="polite"></p>
        </div>
        <div class="record-panel-body" id="recordBody">
          <p class="attention-copy">Opening this record.</p>
        </div>
      </aside>
    </section>


  </main>

  <footer class="footer" data-panel-background><span id="pageFooter">DoctorCRE · Records</span></footer>

  <script type="module" src="/js/workspace-business.js"></script>
</body>
</html>
