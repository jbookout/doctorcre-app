<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="DoctorCRE clients and vendors">
  <title>Clients · DoctorCRE</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/dealroom-192.png">
  <link rel="icon" href="/icons/dealroom.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/workspace.css">
  <link rel="stylesheet" href="/css/workspace-business.css">
  <link rel="stylesheet" href="/css/correspondence.css">
  <link rel="stylesheet" href="/css/app-shell.css">
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <!-- The open record is a dialog at every width. Its covered background is
       inert so keyboard and screen-reader focus remain inside the dialog. -->
  <a class="skip" href="#main" data-panel-background>Skip to records</a>


  <main id="main" class="shell business-shell">
    <section data-layout-slot="sidebar" class="hero business-hero" aria-labelledby="pageTitle" data-panel-background>
      <div>
        <p class="eyebrow"><a class="back-home" href="/">&larr; Home</a> · <span id="viewerWorkspace">Partner workspace</span></p>
        <h1 id="pageTitle">Clients</h1>
      </div>
      <div class="hero-meta" aria-label="Status">
        <span id="observedAt" class="observed">Updating…</span><button type="button" class="refresh-icon" id="refreshList" aria-label="Refresh" title="Refresh">↻</button>
      </div>
    </section>

    <div class="search-dock glass" data-panel-background>
      <div class="field field-search">
        <label for="searchInput">Search</label>
        <input id="searchInput" name="q" form="filterForm" type="search" autocomplete="off" spellcheck="false" maxlength="80" placeholder="Search by name">
      </div>
    </div>
    <section class="business-controls" aria-labelledby="controlsTitle" data-panel-background>
      <h2 class="visually-hidden" id="controlsTitle">Search and filter</h2>
      <form id="filterForm" class="filter-form glass" novalidate>
        <div class="filter-row">
          <div class="field" data-field="a">
            <label for="filterA" id="filterALabel">Status</label>
            <select id="filterA" name="a"><option value="">Any status</option></select>
          </div>
          <div class="field" data-field="b">
            <label for="filterB" id="filterBLabel">Client type</label>
            <select id="filterB" name="b"><option value="">Any client type</option></select>
          </div>
          <div class="field" data-field="c">
            <label for="filterC" id="filterCLabel">Pipeline</label>
            <select id="filterC" name="c"><option value="any">Any pipeline</option></select>
          </div>
          <div class="field">
            <label for="sortSelect">Sort</label>
            <select id="sortSelect" name="sort">
              <option value="name">Alphabetical</option>
              <option value="vertical">Vertical</option>
              <option value="deal_type">Deal type</option>
              <option value="last_deal_desc">Last deal · most recent</option>
              <option value="last_deal_asc">Last deal · least recent</option>
              <option value="territory" data-vendor-sort>Territory</option>
            </select>
          </div>
        </div>
        <div class="filter-row filter-row-actions">
          <div class="scope-switch" id="scopeSwitch" role="group" aria-label="Record scope">
            <button type="button" class="scope-option on" data-owner="all" aria-pressed="true">All</button>
            <button type="button" class="scope-option" data-owner="joe" aria-pressed="false">Joe</button>
            <button type="button" class="scope-option" data-owner="dell" aria-pressed="false">Dell</button>
          </div>
<div class="field territory-field" id="territoryField" hidden><label for="territoryInput">Territory</label><input id="territoryInput" maxlength="80" placeholder="All territories" list="territories"><datalist id="territories"></datalist></div>
          <div class="filter-actions">
            <button type="submit" class="action primary-action" id="applyFilters">Apply</button>
            <button type="button" class="action secondary-action" id="resetFilters">Reset</button>
          </div>
        </div>
      </form>
      <div id="chipBar" class="chip-bar" aria-label="Active filters"></div>
    </section>

    <div id="noticeRegion" class="notice-region" role="status" aria-live="polite" data-panel-background></div>

    <section class="business-body" aria-labelledby="resultsTitle">
      <div class="result-column" data-panel-background>
        <div class="result-heading">
          <h2 id="resultsTitle">Results</h2>
          <p class="result-summary" id="resultSummary" tabindex="-1">Checking…</p>
        </div>
        <div id="listRegion" class="list-region" aria-busy="true" aria-describedby="resultSummary">
          <ol class="record-list" id="recordList">
            <li class="record-skeleton"><span class="skeleton-line"></span><span class="skeleton-line short"></span></li>
            <li class="record-skeleton"><span class="skeleton-line"></span><span class="skeleton-line short"></span></li>
            <li class="record-skeleton"><span class="skeleton-line"></span><span class="skeleton-line short"></span></li>
          </ol>
        </div>
        <div id="scrollSentinel" aria-hidden="true"></div>

      </div>

      <div class="record-backdrop" id="recordBackdrop" hidden></div>
      <aside class="record-panel glass" id="recordPanel" role="dialog" aria-modal="true" aria-labelledby="recordTitle" hidden>
        <div class="record-panel-head">
          <div>
            <p class="eyebrow" id="recordEyebrow">Client</p>
            <h2 id="recordTitle" tabindex="-1">Opening…</h2>
          </div>
          <button type="button" class="panel-close" id="recordClose" aria-label="Close record">×</button>
        </div>
        <div class="record-panel-body" id="recordBody">
          <p class="attention-copy">Opening this record.</p>
        </div>
      </aside>
    </section>


  </main>

  <footer class="footer" data-panel-background><span>DoctorCRE · Clients and Vendors</span></footer>

  <script type="module" src="/js/workspace-business.js"></script>
</body>
</html>
