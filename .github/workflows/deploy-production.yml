name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  production:
    if: >-
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    concurrency:
      group: doctorcre-app-production
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate successful CI completion
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/production-candidate.py
      - if: steps.candidate.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
          cache: npm
      - if: steps.candidate.outputs.ready == 'true'
        run: npm ci
      - if: steps.candidate.outputs.ready == 'true'
        uses: ./.github/actions/setup-browsers
        with:
          browsers: chromium
      - if: steps.candidate.outputs.ready == 'true'
        run: npm run build
        env:
          DOCTORCRE_SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
      - if: steps.candidate.outputs.ready == 'true'
        run: npm run artifact:verify
      - if: steps.candidate.outputs.ready == 'true'
        name: Revalidate candidate before publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/production-candidate.py
      - if: steps.publication.outputs.ready == 'true'
        name: Deploy production
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::production environment requires CLOUDFLARE_API_TOKEN'; exit 1; }
          node scripts/release-production.mjs
      - if: steps.publication.outputs.ready == 'true'
        name: Verify production release identity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { readAppRelease, proofFetch } from './scripts/app-release-reader.mjs';
          import { verifyAppRelease } from './scripts/verify-app-release.mjs';
          await verifyAppRelease('https://app.doctorcre.com/app-release', process.env.SOURCE_COMMIT, 'production', { fetchRelease: proofFetch });
          const release = await readAppRelease('https://app.doctorcre.com');
          assert.equal(release.service, 'doctorcre-app');
          assert.equal(release.environment, 'production');
          assert.equal(release.source_commit, process.env.SOURCE_COMMIT);
          assert.equal(release.provider_version_id, process.env.PROVIDER_VERSION_ID);
          const candidate = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/production-candidate.json`, 'utf8'));
          await writeFile(`${process.env.RUNNER_TEMP}/production-release.json`, JSON.stringify({
            ...candidate, disposition: process.env.DISPOSITION, release,
            publication_observed_at: process.env.PUBLICATION_OBSERVED_AT,
            deploy_run_id: process.env.GITHUB_RUN_ID, deploy_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            verified_at: new Date().toISOString(),
          }));
          NODE
        env:
          PUBLICATION_OBSERVED_AT: ${{ steps.publish.outputs.publication_observed_at }}
          DISPOSITION: ${{ steps.publish.outputs.disposition }}
          PROVIDER_VERSION_ID: ${{ steps.publish.outputs.provider_version_id }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
      - if: steps.publication.outputs.ready == 'true'
        name: Verify signed-out page gates
        env:
          DOCTORCRE_SMOKE_URL: https://app.doctorcre.com
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = new URL(process.env.DOCTORCRE_SMOKE_URL);
          for (const page of ['/deals', '/leads', '/invoices', '/control-room/progress', '/doc-chats']) {
            let target = new URL(page, base);
            const visited = new Set();
            while (target.pathname !== '/auth/login') {
              assert.ok(visited.size < 10 && !visited.has(target.href), `${page}: redirect loop or limit`);
              visited.add(target.href);
              const response = await fetch(target, { redirect: 'manual', credentials: 'omit', signal: AbortSignal.timeout(30_000) });
              assert.ok(!response.headers.has('cf-mitigated'), `${page}: Cloudflare challenge`);
              assert.ok([301, 302, 303, 307, 308].includes(response.status), `${page} requires a sign-in redirect: HTTP ${response.status}`);
              const location = response.headers.get('location');
              assert.ok(location, `${page}: missing redirect location`);
              target = new URL(location, target);
              assert.equal(target.origin, base.origin);
              assert.equal(target.username, '');
              assert.equal(target.password, '');
              assert.equal(target.hash, '');
            }
            assert.equal(target.searchParams.get('return_to'), page);
          }
          const status = await fetch(new URL('/status', base), { redirect: 'manual', credentials: 'omit', signal: AbortSignal.timeout(30_000) });
          assert.equal(status.status, 200);
          assert.match(status.headers.get('content-type') || '', /text\/html/);
          NODE
      - if: steps.publication.outputs.ready == 'true'
        name: Run production browser smoke
        run: node node_modules/e2e/dist/cli/bin.js run --config e2e.production.config.ts --target chromium --output .e2e/production-smoke
        env:
          E2E_TELEMETRY_DISABLED: '1'
          DOCTORCRE_SMOKE_URL: https://app.doctorcre.com
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-${{ steps.candidate.outputs.source_commit }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .e2e/production-smoke
          if-no-files-found: warn
          retention-days: 7
      - if: always()
        name: Retain deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-*.json
          if-no-files-found: error
          retention-days: 14
