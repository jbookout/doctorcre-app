name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  production:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: doctorcre-app-production
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact CI source against live release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/production-candidate.py
      - if: steps.candidate.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
      - if: steps.candidate.outputs.ready == 'true'
        run: npm ci
      - if: steps.candidate.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.candidate.outputs.ready == 'true'
        run: npm run build
        env:
          DOCTORCRE_SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
      - if: steps.candidate.outputs.ready == 'true'
        run: npm run artifact:verify
      - if: steps.candidate.outputs.ready == 'true'
        name: Require exact admitted source
        env:
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - if: steps.candidate.outputs.ready == 'true'
        name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::production environment requires CLOUDFLARE_API_TOKEN'; exit 1; }
          node scripts/release-production.mjs
      - if: steps.candidate.outputs.ready == 'true'
        name: Verify production release identity
        run: node scripts/verify-app-release.mjs https://app.doctorcre.com/app-release "$SOURCE_COMMIT" production
        env:
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
      - if: steps.candidate.outputs.ready == 'true'
        name: Verify signed-out page gates
        env:
          DOCTORCRE_SMOKE_URL: https://app.doctorcre.com
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = new URL(process.env.DOCTORCRE_SMOKE_URL);
          for (const page of ['/deals', '/leads', '/invoices', '/control-room/progress', '/doc-chats']) {
            let target = new URL(page, base);
            const visited = new Set();
            while (target.pathname !== '/auth/login') {
              assert.ok(visited.size < 10 && !visited.has(target.href), `${page}: redirect loop or limit`);
              visited.add(target.href);
              const response = await fetch(target, { redirect: 'manual', credentials: 'omit', signal: AbortSignal.timeout(30_000) });
              assert.ok(!response.headers.has('cf-mitigated'), `${page}: Cloudflare challenge`);
              assert.ok([301, 302, 303, 307, 308].includes(response.status), `${page} requires a sign-in redirect: HTTP ${response.status}`);
              const location = response.headers.get('location');
              assert.ok(location, `${page}: missing redirect location`);
              target = new URL(location, target);
              assert.equal(target.origin, base.origin);
              assert.equal(target.username, '');
              assert.equal(target.password, '');
              assert.equal(target.hash, '');
            }
            assert.equal(target.searchParams.get('return_to'), page);
          }
          const status = await fetch(new URL('/status', base), { redirect: 'manual', credentials: 'omit', signal: AbortSignal.timeout(30_000) });
          assert.equal(status.status, 200);
          assert.match(status.headers.get('content-type') || '', /text\/html/);
          NODE
      - if: steps.candidate.outputs.ready == 'true'
        name: Run production browser smoke
        run: node node_modules/e2e/dist/cli/bin.js run --config e2e.production.config.ts --target chromium --output .e2e/production-smoke
        env:
          E2E_TELEMETRY_DISABLED: '1'
          DOCTORCRE_SMOKE_URL: https://app.doctorcre.com
      - if: success() && steps.candidate.outputs.ready == 'true'
        name: Record publication outcome
        run: echo "Published and verified source $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
      - if: failure()
        name: Record failed publication outcome
        run: echo '::error::Production run failed; publication and verification did not both complete'
      - if: failure()
        run: echo 'Production run failed; inspect publication and release verification steps.' >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-${{ steps.candidate.outputs.source_commit }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .e2e/production-smoke
          if-no-files-found: warn
          retention-days: 7
