name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: doctorcre-app-production
  cancel-in-progress: false

jobs:
  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ci_run=$(gh run list --workflow ci.yml --commit "$SOURCE_COMMIT" --event push --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$ci_run" || { echo '::error::No main CI run exists for the staged source'; exit 1; }
          gh run watch "$ci_run" --exit-status --interval 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          DOCTORCRE_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - run: npm run artifact:verify
      - name: Require current main source
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::production environment requires CLOUDFLARE_API_TOKEN'; exit 1; }
          node scripts/release-production.mjs
      - name: Verify production release identity
        run: node scripts/verify-app-release.mjs https://app.doctorcre.com/app-release "$SOURCE_COMMIT" production
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - name: Verify signed-out page gates
        env:
          DOCTORCRE_SMOKE_URL: https://app.doctorcre.com
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = new URL(process.env.DOCTORCRE_SMOKE_URL);
          for (const page of ['/deals', '/leads', '/invoices', '/control-room/progress', '/doc-chats']) {
            const response = await fetch(new URL(page, base), { redirect: 'manual', signal: AbortSignal.timeout(30_000) });
            assert.ok([301, 302, 303, 307, 308].includes(response.status), `${page} requires a sign-in redirect`);
            const target = new URL(response.headers.get('location'), base);
            assert.equal(target.origin, base.origin);
            assert.equal(target.pathname, '/auth/login');
            assert.equal(target.searchParams.get('return_to'), page);
          }
          const status = await fetch(new URL('/status', base), { signal: AbortSignal.timeout(30_000) });
          assert.equal(status.status, 200);
          assert.match(status.headers.get('content-type') || '', /text\/html/);
          NODE
      - name: Run production browser smoke
        run: node node_modules/e2e/dist/cli/bin.js run --config e2e.production.config.ts --target chromium --output .e2e/production-smoke
        env:
          E2E_TELEMETRY_DISABLED: '1'
          DOCTORCRE_SMOKE_URL: https://app.doctorcre.com
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .e2e/production-smoke
          if-no-files-found: warn
          retention-days: 7
