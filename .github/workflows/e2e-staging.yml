name: e2e-staging

# Signed-in suite against the deployed staging Worker (e2e.staging.config.ts).
# Separate from e2e.yml on purpose: e2e.yml is the secret-free deterministic
# suite (test/e2e-suite.test.mjs pins that), and this suite needs one secret.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Per the e2e docs: docs/ci.mdx (install browsers as their own step, upload
  # artifacts unless cancelled) and docs/github.mdx (one PR comment per run via
  # the github() reporter, which needs pull-requests: write and GITHUB_TOKEN).
  # Runs only when the repository secret E2E_STAGING_SESSION_SECRET (the bearer
  # for staging POST /auth/e2e-session) is set; otherwise it says so and skips.
  # CI holds no model credential (the ChatGPT subscription login is local-only),
  # so this job runs the deterministic staging tests: every screen on both
  # viewports and the record-layer API tests. Agent journeys and bug-bash
  # repros run locally (`--exclude-tag bugbash` keeps repros out of any gate).
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      E2E_TELEMETRY_DISABLED: "1"
      E2E_STAGING_SESSION_SECRET: ${{ secrets.E2E_STAGING_SESSION_SECRET }}
    steps:
      - id: gate
        run: |
          if [ -n "$E2E_STAGING_SESSION_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=staging e2e skipped::Repository secret E2E_STAGING_SESSION_SECRET (staging /auth/e2e-session bearer) is not set."
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.ready == 'true'
        name: Write the session secret to a mode-600 file
        run: |
          umask 077
          printf '%s' "$E2E_STAGING_SESSION_SECRET" > "$RUNNER_TEMP/e2e-session-secret"
          echo "E2E_SESSION_SECRET_FILE=$RUNNER_TEMP/e2e-session-secret" >> "$GITHUB_ENV"
      - if: steps.gate.outputs.ready == 'true'
        run: npx e2e run --config e2e.staging.config.ts tests/staging/screens.e2e.ts tests/staging/api --exclude-tag bugbash
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-staging-report-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/artifacts
          if-no-files-found: warn
          retention-days: 7
