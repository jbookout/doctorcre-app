name: Signed-in staging tests

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!_to_delete/**'
      - '!.github/**'
      - '.github/workflows/staging-e2e.yml'
      - 'playwright.config.ts'
      - 'scripts/staging-summary.mjs'
      - 'test/staging-*.test.mjs'
      - 'tests/staging/**'

permissions:
  contents: read

concurrency:
  group: signed-in-staging
  cancel-in-progress: false

jobs:
  staging:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          DOCTORCRE_SOURCE_COMMIT: ${{ github.sha }}
      - run: npm run artifact:verify
      - name: Deploy staging
        run: npm run release:staging -- --source-sha "$SOURCE_COMMIT"
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify staging release identity
        run: node scripts/verify-app-release.mjs https://doctorcre-app-staging.joe-bookout-carr-us.workers.dev/app-release "$SOURCE_COMMIT" staging
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Run signed-in staging tests
        id: playwright
        run: npx playwright test --project=chromium --retries=1 --reporter=line,html,json
        env:
          E2E_SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET }}
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: .e2e/playwright-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: .e2e/staging-results.json
      - name: Summarize results and flaky tests
        if: ${{ !cancelled() && steps.playwright.outcome != 'skipped' }}
        run: node scripts/staging-summary.mjs .e2e/staging-results.json >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .e2e/playwright-report
            .e2e/playwright
            .e2e/staging-results.json
          if-no-files-found: warn
          retention-days: 7
