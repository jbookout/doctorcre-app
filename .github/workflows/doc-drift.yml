name: Instruction drift

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-drift-${{ github.event_name }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/doc-drift/requirements.txt
      - name: Check changed instructions and their references
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/doc-drift/ci.py --base "$BASE_SHA"
          else
            python scripts/doc-drift/ci.py
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: instruction-drift-report
          path: out/doc-drift/report.json
          if-no-files-found: error

  weekly-loops:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: instruction-drift-report
          path: out/doc-drift
      - name: File or clear one loop per stale file for the orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_REPO: ${{ github.repository }}
        run: python3 scripts/doc-drift/loops.py --report out/doc-drift/report.json --repo "$REPORT_REPO" --apply
