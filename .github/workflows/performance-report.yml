name: Performance report comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: performance-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always trusted main. Never execute scripts or install from the PR artifact.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: binding
        name: Find the current open PR and the exact run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"$HEAD_SHA\") | .number" | head -1)
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("performance-") and endswith("-"+env.RUN_ATTEMPT)) | .id' | head -1)
          if [[ "$number" =~ ^[0-9]+$ && "$artifact" =~ ^[0-9]+$ ]]; then
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.binding.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.binding.outputs.artifact }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: performance-data
          merge-multiple: true
      - if: steps.binding.outputs.artifact != ''
        name: Update the single performance comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.binding.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/performance-comment.mjs performance-data/report.json "$PR_NUMBER" "$HEAD_SHA"
