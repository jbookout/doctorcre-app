name: Checks

# CI calls these checks for PRs, main pushes and merge groups.
# The nightly full-main backstop and manual dispatch run checks on their own.
# CI has no schedule or dispatch trigger for its producer-code live job.
on:
  workflow_call:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-image:
    uses: ./.github/workflows/ci-image.yml

  checks:
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.image }}
      options: --init --user 1001:1001
    env:
      HOME: /home/ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify prebuilt app capabilities without repair
        run: python3 /opt/ci/capabilities.py verify app
      - name: Require typed surfaces
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        run: node scripts/check-typed-surfaces.mjs "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      - run: npm ci
      - run: node scripts/verify-ci-image.ts
      - run: npm run ci:fast
      - id: producer
        name: Read the CARR runtime revision from the consumer contract
        run: >-
          node -e 'const fs = require("node:fs"); const producer = JSON.parse(fs.readFileSync("contracts/carr-interface.v1/producer.json", "utf8")); if (producer.repository !== "DoctorCRE/carr-system" || !/^[0-9a-f]{40}$/.test(producer.source_commit)) throw new Error("Invalid CARR runtime pin"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit=" + producer.source_commit + "\n");'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DoctorCRE/carr-system
          ref: ${{ steps.producer.outputs.commit }}
          path: carr-producer
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned producer Python without repair
        run: node scripts/verify-ci-image.ts ../carr-producer
      - run: npm ci --prefix ../carr-producer/mcp-server
      - run: node --test test/property-producer.test.mjs test/room-write-contract.test.mjs
        name: Verify the exact CARR runtime interface
        env:
          CARR_PRODUCER_CHECKOUT: ${{ github.workspace }}/carr-producer
      - name: Verify pinned Tour producer contracts
        run: node --test --test-name-pattern="committed digest producer detail|advertised runtime composer POST" test/tour-composer.test.mjs test/tour-itinerary-map.test.mjs
        env:
          CARR_PRODUCER_CHECKOUT: ${{ github.workspace }}/carr-producer
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - run: npm run check
      - run: node --test test/client-lint.test.mjs
      - run: node --test test/*.browser.ts
      - run: |
          python3 -m venv ../carr-producer/.venv
          ../carr-producer/.venv/bin/pip install -r ../carr-producer/requirements.lock
          echo "$(cd ../carr-producer && pwd)/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify signed-in Calendar through the app and CARR Workers
        run: node --test test/calendar-access-browser.test.mjs
        env:
          CARR_LOCAL_PG_BIN_DIR: /usr/lib/postgresql/17/bin
          CARR_PRODUCER_CHECKOUT: ${{ github.workspace }}/carr-producer
      - name: Verify Control Room attention and title behavior
        if: ${{ github.event_name == 'pull_request' }}
        run: npx playwright test --project=fixtures tests/fixtures/control-room-c3.spec.mjs tests/fixtures/control-room-queue.spec.mjs
      - run: node --test test/artifact.test.mjs test/ci-workflows.test.mjs
        if: ${{ github.event_name == 'push' }}
      - run: npm run build
      - run: npm run artifact:verify
