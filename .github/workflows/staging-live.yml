      predecessor: ${{ steps.run.outputs.predecessor }}
      plan_hash: ${{ steps.run.outputs.plan_hash }}
      size: ${{ steps.run.outputs.size }}
      job_status: ${{ steps.run.outputs.job_status }}
      accepted_v1: ${{ steps.run.outputs.accepted_v1 }}
      proof_status: ${{ steps.run.outputs.proof_status }}
      tour_status: ${{ steps.run.outputs.tour_status }}
    env:
