name: bounded staging V1 continuation

# Four serial encrypted payload slots, each at most 256 MiB and retained one
# day (at most 4 x 256 MiB of payload). The 256 MiB run ledger is logical
# retained/new content; authenticated transfer never refunds prior charges.
# Caller tests measure the separate 3-slot transient disk and 6-slot RSS caps.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only startup canary or bounded serial continuation
        type: choice
        options: [canary, full]
        default: canary
      deployed_app_source:
        description: Exact deployed staging app source SHA
        type: string
        required: true

concurrency:
  group: staging-live-disposable-data
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  E2E_EXPECTED_APP_SHA: ${{ inputs.deployed_app_source }}
  E2E_V2_OUTPUT: ${{ github.workspace }}/out/orch/e2e-v2
  E2E_EVIDENCE_PACKAGE: ${{ github.workspace }}/out/orch/e2e-v2-public
  E2E_CONTINUATION_DIRECTORY: ${{ github.workspace }}/out/orch/e2e-continuation-private
  E2E_RESTORE_DIRECTORY: ${{ github.workspace }}/out/orch/e2e-restore-private
  E2E_MODEL_ROOM_DESCRIPTOR: ${{ vars.E2E_MODEL_ROOM_DESCRIPTOR }}
  E2E_MODEL_ROOM_DESCRIPTOR_SHA256: ${{ vars.E2E_MODEL_ROOM_DESCRIPTOR_SHA256 }}
  E2E_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      started_at: ${{ steps.plan.outputs.started_at }}
      deadline: ${{ steps.plan.outputs.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - id: plan
        env:
          E2E_MODE: ${{ inputs.mode }}
        run: node scripts/e2e-staging/continue-run.mjs plan

  canary:
    if: ${{ inputs.mode == 'canary' }}
    needs: plan
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      E2E_RUN_ID: gh_${{ github.run_id }}_canary
      E2E_EXPECTED_APP_SHA: ${{ inputs.deployed_app_source }}
      E2E_V2_OUTPUT: ${{ github.workspace }}/out/orch/e2e-v2
      E2E_EVIDENCE_PACKAGE: ${{ github.workspace }}/out/orch/e2e-canary-public
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Bind this job's private session file
        env:
          E2E_SESSION_SECRET_FILE: ${{ runner.temp }}/doctorcre-session-${{ github.run_id }}-canary
        run: node scripts/e2e-staging/continue-run.mjs session-path
      - name: Create a fresh private session-secret file
        env:
          E2E_SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET }}
        run: node scripts/e2e-staging/continue-run.mjs session-secret
      - run: node scripts/e2e-staging/continue-run.mjs canary
      - run: node scripts/e2e-staging/continue-run.mjs publication-boundary
      - name: Publish startup-only receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-read-only-startup-canary
          path: out/orch/e2e-canary-public/startup-canary.json
          if-no-files-found: error
          retention-days: 7
      - run: node scripts/e2e-staging/continue-run.mjs publication-boundary
      - if: ${{ always() && env.E2E_SESSION_SECRET_FILE != '' }}
        run: node scripts/e2e-staging/continue-run.mjs remove-session-secret

  part_1:
    if: ${{ inputs.mode == 'full' }}
    needs: [plan]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 330
    outputs:
      artifact_id: ${{ steps.encrypted.outputs.artifact-id }}
      digest: ${{ steps.run.outputs.digest }}
      generation: ${{ steps.run.outputs.generation }}
      predecessor: ${{ steps.run.outputs.predecessor }}
      plan_hash: ${{ steps.run.outputs.plan_hash }}
      size: ${{ steps.run.outputs.size }}
      job_status: ${{ steps.run.outputs.job_status }}
      accepted_v1: ${{ steps.run.outputs.accepted_v1 }}
      proof_status: ${{ steps.run.outputs.proof_status }}
      tour_status: ${{ steps.run.outputs.tour_status }}
    env:
      E2E_RUN_ID: gh_${{ github.run_id }}_${{ github.sha }}
      E2E_SLOT: '1'
      E2E_STARTED_AT: ${{ needs.plan.outputs.started_at }}
      E2E_DEADLINE: ${{ needs.plan.outputs.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run build
      # Stock GitHub runners currently have no qualified Model Room runtime.
      # This check fails before session authentication until real qualification
      # supplies a verified descriptor; a caller boolean cannot admit a desk.
      - run: node scripts/e2e-staging/continue-run.mjs qualify
      - run: npx playwright install --with-deps chromium
      - run: node scripts/e2e-staging/continue-run.mjs prepare
      - name: Bind this job's private session file
        env:
          E2E_SESSION_SECRET_FILE: ${{ runner.temp }}/doctorcre-session-${{ github.run_id }}-${{ env.E2E_SLOT }}
        run: node scripts/e2e-staging/continue-run.mjs session-path
      - if: ${{ env.E2E_SLOT != '1' }}
        name: Verify the preceding exact GitHub artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/e2e-staging/continue-run.mjs verify-artifact
      - if: ${{ env.E2E_SLOT != '1' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.E2E_PREVIOUS_ARTIFACT_ID }}
          path: out/orch/e2e-restore-private
          merge-multiple: true
      - name: Create a fresh private session-secret file
        env:
          E2E_SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET }}
        run: node scripts/e2e-staging/continue-run.mjs session-secret
      - id: run
        # W15 installer/proof admission is LOCAL ONLY. A missing prerequisite
        # seals PAUSED_LOCAL_INVOICE_FIXTURE, not CONTINUE; downstream jobs
        # remain stopped. No DB/deploy credentials or raw proof are supplied.
        name: Restore, explore, pause for local prerequisites or run guarded journeys, and seal
        run: node scripts/e2e-staging/continue-run.mjs invocation
      - name: Recheck the frozen publication boundary
        env:
          E2E_PUBLICATION_DIGEST: ${{ steps.run.outputs.digest }}
        run: node scripts/e2e-staging/continue-run.mjs publication-boundary
      - id: encrypted
        name: Upload only the encrypted private continuation
        if: ${{ success() && steps.run.outputs.digest != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-continuation-${{ github.run_id }}-${{ env.E2E_SLOT }}
          path: out/orch/e2e-continuation-private/continuation.enc
          if-no-files-found: error
          retention-days: 1
      - name: Recheck the frozen publication boundary
        env:
          E2E_PUBLICATION_DIGEST: ${{ steps.run.outputs.digest }}
        run: node scripts/e2e-staging/continue-run.mjs publication-boundary
      - name: Upload only the sanitized public evidence package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-public-evidence-${{ github.run_id }}-${{ env.E2E_SLOT }}
          path: out/orch/e2e-v2-public
          if-no-files-found: error
          retention-days: 14
      - name: Recheck the frozen publication boundary
        env:
          E2E_PUBLICATION_DIGEST: ${{ steps.run.outputs.digest }}
        run: node scripts/e2e-staging/continue-run.mjs publication-boundary
      - if: ${{ always() && env.E2E_SESSION_SECRET_FILE != '' }}
        run: node scripts/e2e-staging/continue-run.mjs remove-session-secret

  part_2:
    if: ${{ needs.part_1.result == 'success' && needs.part_1.outputs.job_status == 'CONTINUE' }}
    needs: [plan, part_1]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 330
    outputs:
      artifact_id: ${{ steps.encrypted.outputs.artifact-id }}
      digest: ${{ steps.run.outputs.digest }}
