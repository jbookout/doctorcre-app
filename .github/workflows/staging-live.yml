        run: node scripts/e2e-staging/continue-run.mjs publication-boundary
      - name: Upload only the sanitized public evidence package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-public-evidence-${{ github.run_id }}-${{ env.E2E_SLOT }}
          path: out/orch/e2e-v2-public
          if-no-files-found: error
          retention-days: 14
      - name: Recheck the frozen publication boundary
        env:
          E2E_PUBLICATION_DIGEST: ${{ steps.run.outputs.digest }}
        run: node scripts/e2e-staging/continue-run.mjs publication-boundary
      - if: ${{ always() && env.E2E_SESSION_SECRET_FILE != '' }}
        run: node scripts/e2e-staging/continue-run.mjs remove-session-secret

  full_v1_proof:
    if: ${{ always() && inputs.mode == 'full' }}
    needs: [part_1, part_2, part_3, part_4]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep resumable job success separate from full V1 acceptance
        env:
          ACCEPTED_V1: ${{ needs.part_4.outputs.accepted_v1 || needs.part_3.outputs.accepted_v1 || needs.part_2.outputs.accepted_v1 || needs.part_1.outputs.accepted_v1 }}
        run: test "$ACCEPTED_V1" = true
