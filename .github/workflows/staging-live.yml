name: staging-live every-control sweep

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: staging-live-disposable-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 360
    env:
      E2E_V2_OUTPUT: ${{ github.workspace }}/out/orch/e2e-v2
      E2E_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:staging:selftest
      - name: Materialize the staging secret as a private file
        env:
          E2E_SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET }}
        run: |
          node --input-type=module - <<'JS'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const secret = process.env.E2E_SESSION_SECRET;
          if (!secret || secret.length < 32) throw new Error('Staging E2E secret is not configured');
          const directory = join(process.env.HOME, '.config/carr');
          await mkdir(directory, { recursive: true, mode: 0o700 });
          await writeFile(join(directory, 'e2e-session-secret'), secret, { mode: 0o600 });
          JS
      - run: npm run e2e:staging:sweep
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-live-control-evidence
          path: out/orch/e2e-v2
          if-no-files-found: error
          retention-days: 14
