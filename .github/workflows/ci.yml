name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: node scripts/check-pr-description.mjs
      - run: npm run privacy:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      # PRs test the merge candidate under the strict required `test` context.
      # Main retains build/input checks; tag releases still run the full suite.
      - run: npm test
        if: github.event_name == 'pull_request'
      - run: node --test test/artifact.test.mjs test/ci-workflows.test.mjs
        if: github.event_name == 'push'
      - run: npm run build
      - run: npm run artifact:verify
