name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check changed files for identifying data
        env:
          PRIVACY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$PRIVACY_BASE" ] && [ "$PRIVACY_BASE" != "0000000000000000000000000000000000000000" ]; then
            npm run privacy:check -- --base "$PRIVACY_BASE"
          else
            npm run privacy:check
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run artifact:verify
