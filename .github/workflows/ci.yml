name: CI

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: npm run ci:fast
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: doctorcre-app/package-lock.json
      - run: npm ci
      - id: producer
        name: Read the CARR runtime revision from the consumer contract
        run: >-
          node -e 'const fs = require("node:fs"); const { producer } = JSON.parse(fs.readFileSync("contracts/carr-interface.v1.json", "utf8")); if (producer.repository !== "jbookout/carr-system" || !/^[0-9a-f]{40}$/.test(producer.source_commit)) throw new Error("Invalid CARR runtime pin"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit=" + producer.source_commit + "\n");'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jbookout/carr-system
          ref: ${{ steps.producer.outputs.commit }}
          path: carr-producer
          fetch-depth: 0
          persist-credentials: false
      - run: node --test test/property-producer.test.mjs
        name: Verify the exact CARR runtime interface
        env:
          CARR_PRODUCER_CHECKOUT: ${{ github.workspace }}/carr-producer
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      # PRs test the merge candidate under the strict required `test` context.
      # Main retains build/input checks; tag releases still run the full suite.
      - run: npm test
        if: ${{ github.event_name == 'pull_request' }}
      - name: Verify Control Room attention and title behavior
        if: ${{ github.event_name == 'pull_request' }}
        run: npx playwright test --project=fixtures tests/fixtures/control-room-c3.spec.mjs tests/fixtures/control-room-queue.spec.mjs
      - run: node --test test/artifact.test.mjs test/ci-workflows.test.mjs
        if: ${{ github.event_name == 'push' }}
      - run: npm run build
      - run: npm run artifact:verify
      # Lives inside the existing required test context; no ruleset change needed.
      - run: npm run performance:check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PERFORMANCE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            doctorcre-app/test-artifacts/performance/report.json
            doctorcre-app/test-artifacts/performance/summary.md
            doctorcre-app/test-artifacts/performance/*.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Publish performance summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cat test-artifacts/performance/summary.md >> "$GITHUB_STEP_SUMMARY"

  preview:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: npm ci
      - run: npm run build
        env:
          DOCTORCRE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: dist/site
          if-no-files-found: error
          retention-days: 7
