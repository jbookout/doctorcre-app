name: CI

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require typed surfaces
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        run: node scripts/check-typed-surfaces.mjs "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      - run: npm run ci:fast
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: doctorcre-app/package-lock.json
      - run: npm ci
      - id: producer
        name: Read the CARR runtime revision from the consumer contract
        run: >-
          node -e 'const fs = require("node:fs"); const { producer } = JSON.parse(fs.readFileSync("contracts/carr-interface.v1.json", "utf8")); if (producer.repository !== "jbookout/carr-system" || !/^[0-9a-f]{40}$/.test(producer.source_commit)) throw new Error("Invalid CARR runtime pin"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit=" + producer.source_commit + "\n");'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jbookout/carr-system
          ref: ${{ steps.producer.outputs.commit }}
          path: carr-producer
          fetch-depth: 0
          persist-credentials: false
      - run: node --test test/property-producer.test.mjs test/room-write-contract.test.mjs
        name: Verify the exact CARR runtime interface
        env:
          CARR_PRODUCER_CHECKOUT: ${{ github.workspace }}/carr-producer
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - run: npm run check
      - name: Prefer Ubuntu archives for browser dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify Control Room attention and title behavior
        if: ${{ github.event_name == 'pull_request' }}
        run: npx playwright test --project=fixtures tests/fixtures/control-room-c3.spec.mjs tests/fixtures/control-room-queue.spec.mjs
      - run: node --test test/artifact.test.mjs test/ci-workflows.test.mjs
        if: ${{ github.event_name == 'push' }}
      - run: npm run build
      - run: npm run artifact:verify

  shards:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: doctorcre-app/package-lock.json
      - run: npm ci
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - name: Prefer Ubuntu archives for browser dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run pretest
      - run: node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/4 test/*.test.mjs
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deal-items-${{ github.sha }}-${{ matrix.shard }}
          path: doctorcre-app/out/test-artifacts/deal-items/*.png
          if-no-files-found: ignore
          retention-days: 14

  performance:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: doctorcre-app/package-lock.json
      - run: npm ci
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - name: Prefer Ubuntu archives for browser dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run performance:check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PERFORMANCE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            doctorcre-app/test-artifacts/performance/report.json
            doctorcre-app/test-artifacts/performance/summary.md
            doctorcre-app/test-artifacts/performance/*.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Publish performance summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cat test-artifacts/performance/summary.md >> "$GITHUB_STEP_SUMMARY"

  test:
    if: ${{ always() }}
    needs: [checks, shards, performance]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable jobs to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          SHARDS: ${{ needs.shards.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CHECKS" = success
          if [ "$EVENT" = pull_request ]; then
            test "$SHARDS" = success && test "$PERFORMANCE" = success
          fi

  preview:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run build
        env:
          DOCTORCRE_SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: dist/site
          if-no-files-found: error
          retention-days: 7
