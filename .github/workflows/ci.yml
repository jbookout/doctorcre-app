name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  production-proof:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise invalid and valid product declarations
        run: python3 scripts/production-proof-plan-selftest.py
      - name: Validate current PR production proof declaration
        run: python3 scripts/production-proof-plan.py
        env:
          GH_TOKEN: ${{ github.token }}

  checks:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: doctorcre-app/package-lock.json
      - run: npm ci
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - name: Prefer Ubuntu archives for browser dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run pretest
      - name: Run synthetic files once with native per-file results
        run: python3 scripts/browser-results.py run --input out/browser-results/${{ matrix.shard }} --shard ${{ matrix.shard }}
      - name: Collect first-attempt evidence
        if: ${{ always() }}
        run: python3 scripts/browser-results.py collect --input out/browser-results/${{ matrix.shard }} --output out/browser-results/${{ matrix.shard }}/receipt.json --sha ${{ github.sha }} --run-id ${{ github.run_id }} --attempt ${{ github.run_attempt }} --shard ${{ matrix.shard }} --job-status "${{ job.status }}"
      - name: Retain execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: doctorcre-app/out/browser-results/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deal-items-${{ github.sha }}-${{ matrix.shard }}
          path: doctorcre-app/out/test-artifacts/deal-items/*.png
          if-no-files-found: ignore
          retention-days: 14

  performance:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: doctorcre-app/package-lock.json
      - run: npm ci
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - name: Prefer Ubuntu archives for browser dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run performance:check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PERFORMANCE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            doctorcre-app/test-artifacts/performance/report.json
            doctorcre-app/test-artifacts/performance/summary.md
            doctorcre-app/test-artifacts/performance/*.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Publish performance summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cat test-artifacts/performance/summary.md >> "$GITHUB_STEP_SUMMARY"

  live:
    # Live journeys: the built app against the real CARR Worker at the pinned
    # producer commit, on a disposable migrated PostgreSQL (tests/live).
    # It runs producer code, so it saves no cache, and CI's only triggers are
    # pull requests and pushes. ubuntu-24.04 is the image carr-system's own CI
    # installs zsh and PostgreSQL on; 26.04 serves amd64v3 builds that
    # ops/ci-zsh.sh cannot verify against the plain amd64 index.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: producer
        name: Read the CARR runtime revision from the consumer contract
        run: >-
          node -e 'const fs = require("node:fs"); const producer = JSON.parse(fs.readFileSync("contracts/carr-interface.v1/producer.json", "utf8")); if (producer.repository !== "DoctorCRE/carr-system" || !/^[0-9a-f]{40}$/.test(producer.source_commit)) throw new Error("Invalid CARR runtime pin"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit=" + producer.source_commit + "\n");'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DoctorCRE/carr-system
          ref: ${{ steps.producer.outputs.commit }}
          path: carr-producer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: carr-producer/.nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: carr-producer/.python-version
      - name: Install the CARR runtime the way its own CI does
        # zsh: the post-call worker applies a call's changes through run.sh,
        # whose shebang is /bin/zsh; ubuntu-latest has none.
        working-directory: carr-producer
        env:
          ZSH_ARCHIVE_DIR: ${{ runner.temp }}/zsh-debs
        run: |
          bash ops/ci-zsh.sh
          bash ops/ci-postgres.sh
          python -m pip install -r requirements.lock
          npm --prefix mcp-server ci --no-audit
      - run: npm ci
      - name: Prefer Ubuntu archives for browser dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run the live journeys
        run: npx playwright test --project=live
        env:
          CARR_PRODUCER_CHECKOUT: ${{ github.workspace }}/carr-producer
          CARR_LOCAL_PG_BIN_DIR: /usr/lib/postgresql/17/bin
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-journeys-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: doctorcre-app/.e2e/live-playwright
          retention-days: 7

  test:
    if: ${{ always() }}
    needs: [checks, shards, performance, live, production-proof, journeys]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/browser-results-selftest.py
      - name: Download execution evidence
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: browser-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: out/browser-results
      - name: Require complete critical execution
        if: ${{ always() }}
        run: python3 scripts/browser-results.py verify --input out/browser-results --output out/browser-coverage.json --sha ${{ github.sha }} --run-id ${{ github.run_id }} --attempt ${{ github.run_attempt }}
      - name: Retain critical coverage decision
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/browser-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Require all applicable jobs to pass
        if: ${{ always() }}
        env:
          CHECKS: ${{ needs.checks.result }}
          JOURNEYS: ${{ needs.journeys.result }}
          SHARDS: ${{ needs.shards.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          LIVE: ${{ needs.live.result }}
          PRODUCTION_PROOF: ${{ needs.production-proof.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CHECKS" = success
          test "$LIVE" = success
          test "$SHARDS" = success
          test "$JOURNEYS" = success
          if [ "$EVENT" = pull_request ]; then
            test "$PRODUCTION_PROOF" = success
            test "$PERFORMANCE" = success
          fi

  preview:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run build
        env:
          DOCTORCRE_SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: dist/site
          if-no-files-found: error
          retention-days: 7

  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_TELEMETRY_DISABLED: "1"
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=fixtures
      - run: npx e2e run
      - run: npm run test:regressions
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          include-hidden-files: true
          path: |
            .e2e/report.json
            .e2e/artifacts
            .e2e/logs
            .e2e/regressions/report.json
            .e2e/regressions/artifacts
          retention-days: 7

  production:
    needs: [test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          DOCTORCRE_SOURCE_COMMIT: ${{ github.sha }}
      - run: npm run artifact:verify
      - name: Require exact tested source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::production environment requires CLOUDFLARE_API_TOKEN'; exit 1; }
          node scripts/release-production.mjs

  proof:
    needs: [production]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify production release identity
        run: node scripts/verify-app-release.mjs https://app.doctorcre.com/app-release "$SOURCE_COMMIT" production
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Verify signed-out page gates
        env:
          DOCTORCRE_SMOKE_URL: https://app.doctorcre.com
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = new URL(process.env.DOCTORCRE_SMOKE_URL);
          for (const page of ['/deals', '/leads', '/invoices', '/control-room/progress', '/doc-chats']) {
            let target = new URL(page, base);
            const visited = new Set();
            while (target.pathname !== '/auth/login') {
              assert.ok(visited.size < 10 && !visited.has(target.href), `${page}: redirect loop or limit`);
              visited.add(target.href);
              const response = await fetch(target, { redirect: 'manual', credentials: 'omit', signal: AbortSignal.timeout(30_000) });
              assert.ok(!response.headers.has('cf-mitigated'), `${page}: Cloudflare challenge`);
              assert.ok([301, 302, 303, 307, 308].includes(response.status), `${page} requires a sign-in redirect: HTTP ${response.status}`);
              const location = response.headers.get('location');
              assert.ok(location, `${page}: missing redirect location`);
              target = new URL(location, target);
              assert.equal(target.origin, base.origin);
              assert.equal(target.username, '');
              assert.equal(target.password, '');
              assert.equal(target.hash, '');
            }
            assert.equal(target.searchParams.get('return_to'), page);
          }
          const status = await fetch(new URL('/status', base), { redirect: 'manual', credentials: 'omit', signal: AbortSignal.timeout(30_000) });
          assert.equal(status.status, 200);
          assert.match(status.headers.get('content-type') || '', /text\/html/);
          NODE
      - name: Run production browser smoke
        run: node node_modules/e2e/dist/cli/bin.js run --config e2e.production.config.ts --target chromium --output .e2e/production-smoke
        env:
          E2E_TELEMETRY_DISABLED: '1'
          DOCTORCRE_SMOKE_URL: https://app.doctorcre.com
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .e2e/production-smoke
          if-no-files-found: warn
          retention-days: 7
