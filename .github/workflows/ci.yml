name: CI

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'synchronize' || github.event.action == 'ready_for_review' || github.event.action == 'converted_to_draft' || (github.event.action == 'edited' && github.event.changes.base != null)) }}

permissions:
  contents: read

jobs:
  ci-image:
    uses: ./.github/workflows/ci-image.yml

  checks:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  shards:
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.image }}
      options: --init --user 1001:1001
    env:
      HOME: /home/ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify prebuilt app capabilities without repair
        run: python3 /opt/ci/capabilities.py verify app
      - run: npm ci
      - run: node scripts/verify-ci-image.ts
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - run: npm run pretest
      - name: Run synthetic files once with native Node shards
        run: |
          mkdir -p out/browser-results
          node --test --test-shard=${{ matrix.shard }}/4 --test-concurrency=2 --test-timeout=180000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=out/browser-results/junit.xml test/*.test.mjs test/*.browser.ts
      - name: Require critical scenarios in their native shard
        if: ${{ always() }}
        run: python3 scripts/browser-results.py out/browser-results/junit.xml --shard ${{ matrix.shard }}
      - name: Publish native JUnit
        if: ${{ always() }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: doctorcre-app/out/browser-results/junit.xml
          test_files_prefix: doctorcre-app/
          exclude_sources: /build/, /__pycache__/, /node_modules/
          annotate_only: true
          job_summary: true
          detailed_summary: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          require_passed_tests: true
          check_retries: false
          comment: false
      - name: Retain execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: doctorcre-app/out/browser-results/
          if-no-files-found: error
          retention-days: 14
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deal-items-${{ github.sha }}-${{ matrix.shard }}
          path: doctorcre-app/out/test-artifacts/deal-items/*.png
          if-no-files-found: ignore
          retention-days: 14

  performance:
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.image }}
      options: --init --user 1001:1001
    env:
      HOME: /home/ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify prebuilt app capabilities without repair
        run: python3 /opt/ci/capabilities.py verify app
      - run: npm ci
      - run: node scripts/verify-ci-image.ts
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - run: npm run build
      - run: npm run performance:check
        # Report-only switch. Set false after WR622.S1.J348 slice 3 restores Home headroom.
        continue-on-error: true
        env:
          PERFORMANCE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            doctorcre-app/test-artifacts/performance/report.json
            doctorcre-app/test-artifacts/performance/summary.md
            doctorcre-app/test-artifacts/performance/*.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Publish performance summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f test-artifacts/performance/summary.md ]; then
            cat test-artifacts/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Mobile performance budget\n\nMeasurement failed.\nScreen: unavailable (measurement did not produce a summary).\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  live:
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.image }}
      options: --init --user 1001:1001
    env:
      HOME: /home/ci
    # Live journeys: the built app against the real CARR Worker at the pinned
    # producer commit, on a disposable migrated PostgreSQL (tests/live).
    # Producer code runs in the qualified app capability image.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: doctorcre-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: doctorcre-app
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify prebuilt app capabilities without repair
        run: python3 /opt/ci/capabilities.py verify app
      - id: producer
        name: Read the CARR runtime revision from the consumer contract
        run: >-
          node -e 'const fs = require("node:fs"); const producer = JSON.parse(fs.readFileSync("contracts/carr-interface.v1/producer.json", "utf8")); if (producer.repository !== "DoctorCRE/carr-system" || !/^[0-9a-f]{40}$/.test(producer.source_commit)) throw new Error("Invalid CARR runtime pin"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit=" + producer.source_commit + "\n");'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DoctorCRE/carr-system
          ref: ${{ steps.producer.outputs.commit }}
          path: carr-producer
          persist-credentials: false
      - name: Install the CARR runtime the way its own CI does
        working-directory: carr-producer
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          npm --prefix mcp-server ci --no-audit
      - run: npm ci
      - run: node scripts/verify-ci-image.ts ../carr-producer
      - name: Install the pinned CARR checkout as the live test package
        run: node scripts/live-producer.mjs
        env:
          CARR_PRODUCER_CHECKOUT: ${{ github.workspace }}/carr-producer
      - run: npm run build
      - name: Run the live journeys
        run: npx playwright test --project=live
        env:
          CARR_PRODUCER_CHECKOUT: ${{ github.workspace }}/carr-producer
          CARR_LOCAL_PG_BIN_DIR: /usr/lib/postgresql/17/bin
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-journeys-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: doctorcre-app/.e2e/live-playwright
          retention-days: 7

  test:
    if: ${{ always() }}
    needs: [checks, shards, performance, live]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable jobs to pass
        if: ${{ always() }}
        env:
          CHECKS: ${{ needs.checks.result }}
          SHARDS: ${{ needs.shards.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          LIVE: ${{ needs.live.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CHECKS" = success
          test "$LIVE" = success
          test "$SHARDS" = success
          test "$PERFORMANCE" = success

  preview:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: npm ci
      - run: node scripts/verify-ci-image.ts
      - run: npm run build
        env:
          DOCTORCRE_SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: dist/site
          if-no-files-found: error
          retention-days: 7
