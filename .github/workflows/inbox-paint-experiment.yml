name: Inbox paint experiment
on:
  push:
    branches: [wr622-s1-j339-inbox-paint]
    paths: ['.github/workflows/inbox-paint-experiment.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: experiment
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8d294ca787a1a06536c27fc9cfd5421d247bc49a
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a4bbe1580388fb62e92fd373f58f2f760b19114d
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4d1acc9b301cf6e9159ea245268dca56f35a1180
          path: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
      - run: npm ci
        working-directory: diagnostic
      - run: npx playwright install --with-deps chromium
        working-directory: diagnostic
      - run: npm ci && npm run build
        working-directory: head
      - run: npm ci && npm run build
        working-directory: main
      - run: node test/helpers/compare-home-lcp.mjs ../head ../main test-artifacts/j339-linux
        working-directory: diagnostic
      - name: Measure separate causal probes
        working-directory: diagnostic
        run: |
          cp ../experiment/test/helpers/inbox-paint-attribution.mjs test/helpers/
          node test/helpers/inbox-paint-attribution.mjs ../main test-artifacts/j339-attribution
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: inbox-paint-experiment
          path: diagnostic/test-artifacts/j339-*
          if-no-files-found: error
          retention-days: 14
