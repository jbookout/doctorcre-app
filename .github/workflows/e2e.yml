name: e2e

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]
  push:
    branches: [main]

concurrency:
  # PR validation supersedes by workflow + PR. Non-PR verdicts are independent:
  # sharing a non-cancelling group would still replace older pending runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  journeys:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: node scripts/check-pr-description.mjs
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - run: npm run check
      - run: node --test test/e2e-suite.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:staging:selftest
      # Deterministic journeys only: CI configures no model, so agent steps stay local.
      - run: node scripts/browser-product-proof.mjs
        if: github.event_name == 'pull_request' || github.event_name == 'push'
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/full-main.mjs app-e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/artifacts
            .e2e/logs
            .e2e/proof
          if-no-files-found: error
          retention-days: 7
      - if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          include-hidden-files: true
          name: full-main-app-e2e-receipt
          path: .e2e/full-main-app-e2e/receipt.json
          if-no-files-found: error
          retention-days: 7
