name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node --test test/e2e-suite.test.mjs
      - run: npx playwright install --with-deps chromium
      # Deterministic journeys only: CI configures no model, so agent steps stay local.
      - run: npx e2e run tests/journeys --retries 0 --reporter list,junit
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/artifacts
            .e2e/logs
          if-no-files-found: warn
          retention-days: 7
