name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!_to_delete/**'
      - '!.github/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-image:
    uses: ./.github/workflows/ci-image.yml

  journeys:
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.image }}
      options: --init --user 1001:1001
    env:
      HOME: /home/ci
      E2E_TELEMETRY_DISABLED: "1"
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify prebuilt app capabilities without repair
        run: python3 /opt/ci/capabilities.py verify app
      - run: npm ci
      - run: node scripts/verify-ci-image.ts
      - run: npm run build
      - run: npx playwright test --project=fixtures
      - run: npx e2e run
      - run: npm run test:regressions
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          include-hidden-files: true
          path: |
            .e2e/report.json
            .e2e/artifacts
            .e2e/logs
            .e2e/regressions/report.json
            .e2e/regressions/artifacts
          retention-days: 7
