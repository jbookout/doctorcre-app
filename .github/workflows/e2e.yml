name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]
  push:
    branches: [main]

concurrency:
  # PR validation supersedes by workflow + PR. Non-PR verdicts are independent:
  # sharing a non-cancelling group would still replace older pending runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  journeys:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: node scripts/check-pr-description.mjs
      - run: npm run privacy:check
        env:
          DOCTORCRE_PRIVACY_CORPUS_JSON: ${{ secrets.DOCTORCRE_PRIVACY_CORPUS_JSON }}
      - run: npm run check
      - run: node --test test/e2e-suite.test.mjs
      - run: npx playwright install --with-deps chromium
      # Exact-source deterministic product proof remains independent of model access.
      - run: node scripts/browser-product-proof.mjs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/artifacts
            .e2e/logs
            .e2e/proof
          if-no-files-found: error
          retention-days: 7

  agent-shards:
    needs: journeys
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      E2E_TELEMETRY_DISABLED: "1"
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node --test test/e2e-ci.test.mjs
      - run: npm run build
      - run: npx e2e-web install chromium --with-deps
      - name: Run shard and rerun failed tests
        run: node scripts/e2e-ci.mjs shard ${{ matrix.shard }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-shard-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .e2e/ci/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  agent-gate:
    needs: [journeys, agent-shards]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.action != 'closed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      E2E_TELEMETRY_DISABLED: "1"
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: shard-evidence
        with:
          pattern: e2e-shard-*-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: .e2e/ci/downloads
      - name: Place shard reports beside their evidence
        if: ${{ !cancelled() }}
        run: node scripts/e2e-ci.mjs collect .e2e/ci/downloads
      - name: Publish one current PR comment and enforce agent results
        if: ${{ !cancelled() }}
        run: node scripts/e2e-ci.mjs aggregate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOURNEYS_RESULT: ${{ needs.journeys.result }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-aggregate-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .e2e/ci/aggregate.json
          if-no-files-found: error
          retention-days: 7
