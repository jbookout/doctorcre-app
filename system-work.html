<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <meta name="description" content="DoctorCRE workspace system work — sourced concerns, bounded plans, and observed outcome evidence">
  <title>Work Requests · DoctorCRE</title>
  <link rel="stylesheet" href="/css/system.css">
  <link rel="stylesheet" href="css/system-work.css">
  <link rel="stylesheet" href="/css/app-shell.css">
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <a class="skip" href="#systemWorkMain">Skip to Work Requests</a>
  <div data-layout-slot="status">
    <a href="/" class="system-work-brand"><span>DoctorCRE</span><strong>Work Requests</strong></a>
    <span id="systemWorkActor">Checking session…</span>
  </div>
  <main id="systemWorkMain">
    <section data-layout-slot="sidebar" class="system-work-hero">
      <div><p class="eyebrow">Evidence and review</p><h1>Work Requests</h1></div>
      <div class="system-work-open">
        <form id="openWorkRequest"><label for="workRequestRef">Open a Work Request</label>
          <div><input id="workRequestRef" name="human_ref" placeholder="WR-000123" autocomplete="off"><button type="submit">Open</button></div></form>
        <button type="button" id="reportProblemButton" class="system-work-secondary">Report a system problem</button>
      </div>
    </section>
    <div id="systemWorkAlert" class="system-work-alert" role="alert" hidden></div>
    <section id="systemWorkStage" aria-live="polite"></section>
  </main>

  <dialog id="systemWorkDialog">
    <form method="dialog" id="systemWorkForm">
      <header><div><p class="eyebrow" id="systemWorkEyebrow">System work</p><h2 id="systemWorkTitle">Review</h2></div>
        <button type="button" data-system-cancel aria-label="Close">×</button></header>
      <div id="systemWorkFields"></div>
      <p id="systemWorkFormError" class="system-work-form-error" role="alert" hidden></p>
      <footer><button type="button" data-system-cancel class="system-work-secondary">Cancel</button><button type="submit" class="system-work-primary" id="systemWorkSubmit">Continue</button></footer>
    </form>
  </dialog>
  <script type="module" src="js/system-work-app.js"></script>
</body>
</html>
