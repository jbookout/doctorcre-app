<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Lease expiry radar · DoctorCRE</title><link rel="icon" href="/icons/dealroom.svg" type="image/svg+xml"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/css/workspace.css"><link rel="stylesheet" href="/css/app-shell.css"><link rel="stylesheet" href="/css/lease-radar.css"></head><body>
<div id="appShell"></div><script type="module" src="/js/app-shell.js"></script><a class="skip" href="#main">Skip to lease radar</a>
<div data-layout-slot="sidebar" class="lease-controls"><div class="lease-counts"><div><b id="leaseTotal">—</b><span>Expiring leases</span></div><div><b id="leaseGapCount">—</b><span>Missing dates</span></div></div><div id="leaseWindow" class="lease-window"></div><label>Client<input id="leaseSearch" type="search" placeholder="Find client"></label><label>Leases<select id="leaseScope"><option value="team">Team</option><option value="mine">Mine</option></select></label><div class="lease-updated"><span id="leaseUpdated" role="status">Updating…</span><button id="refreshLeases" data-layout-refresh type="button" aria-label="Refresh lease dates" title="Refresh">↻</button></div></div>
<div data-layout-slot="tabs"><button type="button" data-lease-view="timeline" aria-pressed="true">Lease timeline</button><button type="button" data-lease-view="gaps" aria-pressed="false">Missing dates</button></div>
<main id="main" class="lease-radar-main"><p id="leaseNotice" role="status" hidden></p><div id="leaseRadar" aria-live="polite"></div></main><dialog id="leaseDetail" class="lease-detail" aria-labelledby="leaseDetailTitle"></dialog><script type="module" src="/js/lease-radar-entry.js"></script>
</body></html>
