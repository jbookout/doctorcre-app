<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030914">
  <title>Progress board · DoctorCRE</title>
  <link rel="stylesheet" href="/css/progress-board.css">
  <script type="module" src="/js/progress-board.js"></script>
  <link rel="stylesheet" href="/css/app-shell.css">
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="/control-room" aria-label="DoctorCRE Control Room">✦ <span>DoctorCRE</span></a>
      <span class="edition">PROGRESS</span>
    </header>
    <main>
      <nav aria-label="Breadcrumb"><a href="/control-room/progress">Progress</a> › <span id="board-parent-name">Board</span> · <a id="board-activity" href="/control-room/progress/work">Project activity</a></nav>
      <section class="intro" aria-labelledby="board-title">
        <p class="eyebrow">DELIVERY / PROGRESS BOARD</p>
        <h1 id="board-title" tabindex="-1">Progress</h1>
        <p id="board-meta" class="board-meta">Loading published board…</p>
        <span id="board-freshness" class="freshness-badge"></span>
        <p id="board-error" class="error" role="alert" hidden></p>
        <div class="read-recovery"><button data-layout-refresh id="board-retry" type="button" hidden aria-label="Refresh" title="Refresh"><span aria-hidden="true">↻</span></button><a id="board-sign-in" href="/auth/login" hidden>Sign in</a></div>
      </section>
      <section class="panel directory-panel" aria-labelledby="directory-title">
        <div class="panel-heading"><h2 id="directory-title">Published boards</h2></div>
        <p id="directory-error" class="error" role="alert" hidden></p>
        <nav id="board-directory" class="board-directory" aria-label="Published progress boards"></nav>
      </section>
      <p id="board-live" class="sr-only" role="status" aria-live="polite"></p>
      <section class="panel pipeline-panel" aria-labelledby="pipeline-title">
        <div class="panel-heading"><div><p class="eyebrow">01 / DELIVERY</p><h2 id="pipeline-title">The path to live</h2></div><span id="task-count" class="panel-count">—</span></div>
        <div id="board-stages" class="flow-wrap" aria-live="polite">
          <svg id="board-flow" class="pipeline-diagram" role="group" aria-label="Tasks positioned along the six delivery stages"></svg>
        </div>
      </section>
      <section id="system-work-panel" class="panel" hidden aria-labelledby="system-work-title">
        <div class="panel-heading"><h2 id="system-work-title">System design and build work</h2><button id="live-library" type="button" aria-pressed="false">Live Library</button></div>
        <form id="system-work-filters" class="work-filters">
          <label>Search<input name="text" type="search" maxlength="200"></label>
          <label>Category<select name="source"><option value="">All categories</option></select></label>
          <label>Kind<select name="kind"><option value="">All kinds</option></select></label>
          <label>Minimum age in days<input name="age" type="number" min="0" value="0"></label>
          <button type="submit">Search</button>
        </form>
        <p id="system-work-coverage" class="caption" role="status"></p>
        <p id="system-work-error" class="error" role="alert" hidden></p>
        <div id="system-work-cards"></div><button id="system-work-more" type="button" hidden>Load more</button>
      </section>
      <section class="panel questions-panel" aria-labelledby="questions-title">
        <div class="panel-heading"><div><p class="eyebrow">02 / YOUR DECISIONS</p><h2 id="questions-title">Questions waiting on you</h2></div><span id="question-count" class="panel-count">—</span></div>

        <div id="board-questions" class="questions" aria-live="polite"></div>
      </section>
    </main>
    <dialog id="work-triage" aria-label="Review system work action"><button id="work-triage-close" type="button" aria-label="Close">×</button><form id="work-triage-form"></form></dialog>
  </div>
</body>
</html>
